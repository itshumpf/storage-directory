name: CubeSmart Daily Snapshot

on:
  # Off the hour, and away from the other three collectors:
  #   Public Storage 11:17 UTC · Storage Sense 17:43 UTC · U-Haul 06:29 UTC
  # ~1,520 facilities at a 3s base delay + jitter is roughly 90 minutes.
  schedule:
    - cron: '37 13 * * *'
  workflow_dispatch:
    inputs:
      delay:
        description: 'Base seconds between requests'
        required: false
        default: '3'

permissions:
  contents: write

concurrency:
  group: cubesmart-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # curl_cffi is the crawler's browser-impersonating client; it is not in
      # requirements.txt because nothing else in the repo needs it.
      - name: Install dependencies
        run: pip install -r requirements.txt curl_cffi

      - name: Run offline parser contract tests
        run: python test_cubesmart.py --offline

      # --out is the dated snapshot itself, so the crawler's resume logic
      # continues today's file after an interruption instead of skipping every
      # store it already saw yesterday. The pipeline validates it in place.
      - name: Collect one complete snapshot
        id: collect
        continue-on-error: true
        run: >-
          python storage_pipeline.py run cubesmart --
          --delay "${{ inputs.delay || '3' }}"

      - name: Preserve the snapshot
        run: >-
          bash .github/push_with_retry.sh
          "CubeSmart snapshot: $(date +'%Y-%m-%d')"
          history/cubesmart

      - name: Surface a failed collection after the snapshot is safe
        if: steps.collect.outcome == 'failure'
        run: exit 1
