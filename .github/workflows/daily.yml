name: Daily Storage Scraper

on:
  # Minute 17, not 00. GitHub's own docs: "The schedule event can be delayed
  # during periods of high loads... high load times include the start of every
  # hour. If the load is sufficiently high enough, some queued jobs may be
  # dropped." On 2026-08-31 the :00 slot queued about seven hours — every prior
  # run since 2026-07-11 had started shortly after 06:00 local. Moving off the
  # top of the hour is the documented mitigation.
  #
  # 11:00 UTC is 06:00 CDT and 05:00 CST. The cron is fixed in UTC, so the local
  # start time shifts an hour at each DST boundary; the next is 2026-11-01.
  # Nothing depends on the local hour, but a snapshot series that changes its
  # sampling time by an hour twice a year should say so somewhere.
  schedule:
    - cron: '17 11 * * 1-6'  # Mon-Sat
    - cron: '17 11 * * 0'    # Sundays: adds the exhaustive store-ID probe
  workflow_dispatch:         # allows manual trigger from GitHub UI
    inputs:
      deep:
        description: 'Run exhaustive store-ID probe'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history. actions/checkout defaults to a depth-1 shallow clone,
          # and the rebase-and-retry in the push step below cannot rebase onto
          # history it does not have. Added with that retry on 2026-09-01.
          #
          # It costs a bigger clone — .git is around 320 MB and grows with each
          # daily partition — against a job that already runs for over an hour.
          # A minute of clone is the cheapest insurance here: the alternative
          # failure mode is losing a day of collection that cannot be recovered.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        # This string must match the Sunday cron above EXACTLY. It is compared
        # literally, so changing the schedule without changing this line makes
        # the weekly deep probe stop running with no error and no log entry.
        run: python daily_scraper.py ${{ (github.event.schedule == '17 11 * * 0' || inputs.deep == true) && '--deep' || '' }}

      - name: Check output
        run: |
          echo "Stores scraped:"
          python -c "import json; data=json.load(open('enriched_locations.json')); print(f'{len(data)} stores, {sum(1 for s in data if s[\"units\"])} with pricing')"

      # SPLIT 2026-08-31. These produce the durable record — the CSVs and the
      # rate log. If any of them fails the day is genuinely lost and the job
      # should stop.
      - name: Record the day's data
        run: |
          python analysis/load_storage.py enriched_locations.json
          python analysis/update_history.py
          python analysis/update_rate_log.py

      # PUSHED HERE, BEFORE ANYTHING REGENERABLE. Added 2026-09-01.
      #
      # Today's advertised prices exist nowhere else and cannot be collected
      # again tomorrow. The reports and the Parquet corpus can be rebuilt from
      # these CSVs at any time. Leaving all of it to one commit at the end put
      # the irreplaceable thing behind the replaceable ones, so any failure in
      # the back half took the day's prices down with it — which is what
      # happened on 2026-08-31, and again on 2026-09-01 for a different reason.
      #
      # Two pushes in one job is slightly more machinery for a much smaller
      # blast radius: after this step the day is safe no matter what follows.
      - name: Push the day's data
        run: |
          # Invoked as `bash <script>`, not `./<script>`, so it does not depend
          # on the executable bit. Git records that bit, Windows does not carry
          # it, and a file committed 100644 fails here with "Permission denied"
          # — on the step whose entire job is to stop the day being lost.
          bash .github/push_with_retry.sh \
            "Daily data: $(date +'%Y-%m-%d')" \
            enriched_locations.json history/

      # These render the record. They are regenerable from the CSVs at any
      # time, so a failure here must NOT cost the day's collection.
      #
      # On 2026-08-31 build_repricing_stats.py exited 1 — correctly, refusing
      # to emit nulls — and took the commit step down with it. The scrape had
      # succeeded: 4,670 stores, 58,603 listings, 55,011 rate events. All of it
      # died with the runner because a presentation script would not write a
      # summary JSON.
      #
      # continue-on-error surfaces the failure in the UI without failing the
      # job, so the data still commits.
      # update_stock.py is here, not above, because it fetches from an external
      # source. Putting a third-party outage on the critical path would recreate
      # the exact failure this split exists to prevent — and a missed day of
      # share price is recoverable from any provider later, unlike a missed
      # day of advertised rents.
      - name: Rebuild insights and trends reports
        continue-on-error: true
        run: |
          python analysis/update_stock.py
          python analysis/analyze_storage.py
          python analysis/build_trends.py
          python analysis/build_markets.py
          python analysis/build_store_history.py
          python analysis/build_repricing_stats.py

      # Immutable daily Parquet partitions under history/parquet/. Runs after
      # the CSVs are written, and only ever adds files, so a failure here can
      # never damage the day's collection.
      - name: Build Parquet corpus
        run: python analysis/build_parquet.py

      # The second push: the regenerable half. Everything here can be rebuilt
      # from the CSVs already pushed above, so a failure at this point costs
      # rendering time, not data.
      #
      # The public site is frozen at the deploy layer rather than by holding
      # files back: Cloudflare's git integration was disconnected 2026-08-31,
      # so it keeps serving the last build and no push can change it. That
      # makes the repo a private archive.
      #
      # history/ is named again because the Parquet partitions land under it
      # after the first push; git add on an already-committed tree is a no-op.
      - name: Push reports and Parquet
        run: |
          bash .github/push_with_retry.sh \
            "Daily reports and Parquet: $(date +'%Y-%m-%d')" \
            history/ insights.html trends.html markets.html \
            markets-detail.json store-history.json repricing-stats.json

      # LAST, and deliberately after the push. Added 2026-09-01.
      #
      # OFFER_RE stopped matching Public Storage's JSON-LD at some unknown
      # earlier date and the run kept reporting success, because a regex that
      # matches nothing looks exactly like a store with no offers. Every run in
      # between is missing attrs/price_min/price_max and those days cannot be
      # recovered.
      #
      # This step exists only to turn the run red so it gets noticed. It runs
      # after the commit on purpose: the day's collection is already safe on
      # disk and in git before this is allowed to fail anything. Putting it any
      # earlier would skip the commit and destroy the very data it is meant to
      # be protecting — which is what happened on 2026-08-31.
      - name: Verify enrichment
        run: python analysis/check_enrichment.py
