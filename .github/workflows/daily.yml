name: Daily Storage Scraper

on:
  schedule:
    - cron: '0 11 * * 1-6'  # 6am CST (11am UTC) Mon-Sat
    - cron: '0 11 * * 0'    # Sundays: adds the exhaustive store-ID probe
  workflow_dispatch:         # allows manual trigger from GitHub UI
    inputs:
      deep:
        description: 'Run exhaustive store-ID probe'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python daily_scraper.py ${{ (github.event.schedule == '0 11 * * 0' || inputs.deep == true) && '--deep' || '' }}

      - name: Check output
        run: |
          echo "Stores scraped:"
          python -c "import json; data=json.load(open('enriched_locations.json')); print(f'{len(data)} stores, {sum(1 for s in data if s[\"units\"])} with pricing')"

      - name: Rebuild insights and trends reports
        run: |
          python analysis/load_storage.py enriched_locations.json
          python analysis/analyze_storage.py
          python analysis/update_history.py
          python analysis/update_rate_log.py
          python analysis/update_stock.py
          python analysis/build_trends.py
          python analysis/build_markets.py
          python analysis/build_store_history.py
          python analysis/build_repricing_stats.py

      # Immutable daily Parquet partitions under history/parquet/. Runs after
      # the CSVs are written, and only ever adds files, so a failure here can
      # never damage the day's collection.
      - name: Build Parquet corpus
        run: python analysis/build_parquet.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Everything the run produces is committed. The public site is frozen
          # at the deploy layer instead: Cloudflare's git integration was
          # disconnected 2026-08-31, so it keeps serving the last build and no
          # push can change it. That makes the repo a private archive and takes
          # the freeze off this line entirely.
          #
          # history/ carries the Parquet partitions as well as the CSVs.
          git add enriched_locations.json insights.html trends.html history/ markets.html markets-detail.json store-history.json repricing-stats.json
          git diff --staged --quiet || git commit -m "Daily data update: $(date +'%Y-%m-%d')"
          git push
