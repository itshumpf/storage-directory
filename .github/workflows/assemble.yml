# RETIRED 2026-10-04 — NOT THE LIVE SYSTEM.
#
# Collection moved off GitHub Actions when this repository went private and
# Actions minutes metered out. It now runs locally from collect_all.ps1 in the
# repository root. This file is kept for reference only.
#
# Do not diagnose the pipeline from this file. See README.md, "How this got here".

name: Assemble combined dataset

# The seam between the collectors. Each collector job still owns its own
# brand and pushes its own snapshot; this job runs after ANY of them finishes
# (and once a day regardless), merges every brand's freshest snapshot, records
# the cross-brand daily series and rate-change log, and rebuilds the dashboard
# data file. It never scrapes. Everything it writes is rebuildable from the
# per-brand snapshots, so a failure here costs nothing but a rerun.
#
# workflow_run fires on completion regardless of the collector's result — a
# failed U-Haul run still triggers an assemble that simply reuses U-Haul's last
# complete snapshot (or excludes it once it is older than --max-age-days).

on:
  # SCHEDULE REMOVED 2026-10-04. Collection runs only from Braeden's PC via
  # collect_all.ps1. This workflow is manual-only so it can never run itself
  # and race the local collector for the same host or the same branch.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-combined
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main   # workflow_run checks out the triggering commit by default

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Import, merge, record, build
        run: |
          python storage_pipeline.py daily --max-age-days 3
          python storage_pipeline.py status

      # Explicit paths, as always. latest.json is gitignored (rebuildable, ~18 MB/day);
      # the per-brand snapshots it was built from are what the collectors already push.
      - name: Push the combined record
        run: >-
          bash .github/push_with_retry.sh
          "Combined dataset: $(date +'%Y-%m-%d')"
          history/publicstorage
          history/cubesmart
          history/storagemart
          history/smartstop
          history/combined/latest.manifest.json
          history/combined/record_runs.csv
          history/combined/daily-*.csv
          history/combined/sizes-*.csv
          history/combined/rate_changes-*.csv
          history/combined/store-sizes-*.csv
          all_locations.json
          dashboard-data.json
